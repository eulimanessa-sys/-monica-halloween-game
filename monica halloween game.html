    position:absolute; left:2px; right:2px; bottom:2px;
    background:rgba(15,10,30,.82); color:var(--correct);

    transition:opacity .25s, transform .25s;
  }

    display:flex; flex-wrap:wrap; gap:8px; margin-top:18px; min-height:44px;
  }
  .chip{
    background:var(--chip); border:2px solid var(--border); color:var(--ink);
    padding:9px 12px; border-radius:20px; font-size:.86rem; line-height:1.2;
    cursor:pointer; user-select:none; -webkit-user-select:none;
    transition:transform .15s ease, background-color .15s, border-color .15s;
    box-shadow:0 2px 0 rgba(0,0,0,.25);
  }
  .chip.selected{
    border-color:var(--accent); background:#3a2570;
    transform:translateY(-2px); box-shadow:0 4px 0 rgba(0,0,0,.3);
  }
  .chip.placed{ display:none; }
  .chip.shake{ animation:shake .3s; }
  @keyframes shake{
    0%,100%{ transform:translateX(0); }
    25%{ transform:translateX(-5px); }
    75%{ transform:translateX(5px); }
  }
  .dropzone{ cursor:pointer; }
  .controls{ margin-top:20px; display:flex; justify-content:center; }
  button{
    background:transparent; border:1px solid var(--accent); color:var(--accent);
    font-size:.85rem; padding:9px 18px; border-radius:20px; cursor:pointer;
    font-family:inherit;
  }
  button:active{ background:var(--accent); color:#1a0f33; }
  .win{
    text-align:center; margin-top:16px; font-size:1rem; color:var(--correct);
    min-height:1.4em;
  }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

<body>
<div class="wrap">
  <h1>Monica's Gang: Halloween Party</h1>
  <p class="sub">Tap a sentence, then tap the picture it describes. Look at what everyone is doing right now!</p>
  <div class="scoreline"><span>Matches found</span><span><span id="scoreVal">0</span>/9</span></div>
  <div class="board" id="board"></div>
  <div class="tray" id="tray"></div>
  <div class="controls"><button id="resetBtn" type="button">Reset game</button></div>
  <div class="win" id="winMsg" aria-live="polite"></div>
</div>
<script>
const sentences = [
  {id:1, text:"The vampire is flying."},
  {id:2, text:"The ghost is drinking a soda."},
  {id:3, text:"The mummy is running."},
  {id:4, text:"Frankenstein is eating a hamburger."},
  {id:5, text:"The werewolf is running."},
  {id:6, text:"The vampire is dancing."},
  {id:7, text:"The mummy is playing the guitar."},
  {id:8, text:"They are sleeping."},
  {id:9, text:"The monster is jumping."}
];

const board = document.getElementById('board');
const tray = document.getElementById('tray');
const scoreVal = document.getElementById('scoreVal');
const winMsg = document.getElementById('winMsg');
let score = 0;
let selectedChip = null;

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function buildBoard(){
  board.innerHTML = '';
  for(let i=1;i<=9;i++){
    const dz = document.createElement('div');
    dz.className = 'dropzone';
    dz.dataset.index = i;
    const label = document.createElement('div');
    label.className = 'label';
    dz.appendChild(label);
    dz.addEventListener('click', ()=> tryPlace(dz));
    board.appendChild(dz);
  }
}

function buildTray(){
  tray.innerHTML = '';
  selectedChip = null;
  const shuffled = shuffle(sentences);
  shuffled.forEach(s=>{
    const chip = document.createElement('div');
    chip.className = 'chip';
    chip.textContent = s.text;
    chip.dataset.target = s.id;
    chip.tabIndex = 0;
    chip.addEventListener('click', ()=> selectChip(chip));
    tray.appendChild(chip);
  });
}

function selectChip(chip){
  if(chip.classList.contains('placed')) return;
  if(selectedChip === chip){
    chip.classList.remove('selected');
    selectedChip = null;
    return;
  }
  if(selectedChip) selectedChip.classList.remove('selected');
  selectedChip = chip;
  chip.classList.add('selected');
}

function tryPlace(dz){
  if(!selectedChip || dz.classList.contains('correct')) return;
  const chip = selectedChip;
  if(String(dz.dataset.index) === String(chip.dataset.target)){
    dz.classList.add('correct');
    const label = dz.querySelector('.label');
    label.textContent = chip.textContent;
    chip.classList.add('placed');
    chip.classList.remove('selected');
    selectedChip = null;
    score++;
    scoreVal.textContent = score;
    if(score === 9){
      winMsg.textContent = "Great job! All the monsters matched. \ud83c\udf83";
    }
  } else {
    dz.classList.add('wrong');
    chip.classList.add('shake');
    setTimeout(()=>{
      dz.classList.remove('wrong');
      chip.classList.remove('shake');
    }, 350);
  }
}

function resetGame(){
  score = 0;
  scoreVal.textContent = 0;
  winMsg.textContent = '';
  buildBoard();
  buildTray();
}

document.getElementById('resetBtn').addEventListener('click', resetGame);

resetGame();
</script>
</body>
</html>
